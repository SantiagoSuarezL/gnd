[project]
name = "gnd"
version = "0.1.0"
description = "Game Network Diagnostics — asistente de diagnóstico de red pre/en-partida para League of Legends"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Santiago" }]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psutil>=5.9,<8",
    "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.0",
    "vulture>=2.16",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --- ruff: linter único (ENGINEERING_PRINCIPLES.md §6) ---
# Reglas activas mínimas: E, F, I (imports), UP (pyupgrade 3.12), B (bugbear)
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# --- black: formateo, sin custom line-length (ENGINEERING_PRINCIPLES.md §6) ---
[tool.black]
line-length = 88
target-version = ["py312"]
src = ["src", "tests"]

# --- pytest (ENGINEERING_PRINCIPLES.md §4) ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # Tests contra red real (implementacion Fase 2). No corren en CI offline.
    "integration: end-to-end / red real (deselect with '-m \"not integration\"')",
]
addopts = "-m \"not integration\""

# --- vulture: detector de codigo muerto (agregado como guardia extra
# despues del incidente Fase 6 donde x = 1 + 2 + 3 sobrevivio 3 fases
# de ruff+black+pytest sin ser detectado; ruff F841 solo aplica a locales
# dentro de funciones, no a top-level module attrs).
#
# min_confidence=60 para CATCH globales al top-level (como x = 1 + 2 + 3,
# que vulture reporta a 60% con confianza). False positives conocidos
# (Protocols, fakes, side-effects sqlite3) se whitelistean abajo.
[tool.vulture]
min_confidence = 60
paths = ["src/gnd"]
exclude = ["src/gnd/__pycache__"]
ignore_names = [
    # --- domain/ports/* (Protocols declarativos; vulture no los ve como
    # contratos pero los implementadores los cumplen por DI) ---
    "get_latency_baseline",  # DiagnosticsRepository Protocol
    "evaluate",  # RecommendationEngine Protocol
    "save_run",  # DiagnosticsRepository.save_run (Implementaciones de Protocol)
    "save",  # FakeDiagnosticsRepository.save (api de fake usada en tests)
    "get_all",  # FakeDiagnosticsRepository.get_all
    "get_by_provider",  # FakeDiagnosticsRepository.get_by_provider
    # --- domain/fakes/*: APIs publicas de fakes, llamadas desde tests/;
    # vulture no escanea tests/ por defecto ---
    "set_result",
    "set_default_result",
    "set_session_for_run_id",
    "set_default_session",
    # --- protocols de RouteMonitor ---
    "monitor",
    "save_session",
    "get_sessions_by_run",
    # --- protocols de SeriesDataSource (Fase 10): los 5 queries del PRD §10
    # que ChartsSection invoca via getattr por reflection controlada ---
    # vulture no los ve como callers pero el contrato del Protocol exige
    # que estén presentes. ---
    "latency_over_time",
    "packet_loss_over_time",
    "cloudflare_vs_google",
    "riot_latency_over_time",
    "best_hours_to_play",
    # --- live_client_api.is_game_active(): llamada en
    # tests/test_live_client_api.py (5 veces) y scripts/verify_phase6 ---
    "is_game_active",
    # --- ping_parser.all_lost es property usada en
    # tests/test_ping_parser.py (8 referencias) ---
    "all_lost",
    # --- sqlite3 Connection.row_factory es configurado por side-effect:
    # `_conn.row_factory = sqlite3.Row` no es leido como variable, por
    # eso vulture lo marca. El codigo es legitimo (configura el cursor). ---
    "row_factory",
    # --- config/__init__.py: campos Pydantic que no se leen en runtime
    # todavia (live en config.toml para Fase 12) ---
    "lcu_process_names",
    "poll_interval_seconds",
    "baseline_deviation_factor",
    "model_config",
    # --- logging/* overrides de stdlib (Fase 11): metodos que LoggerAdapter
    # y Formatter exigen override y son invocados por la stdlib en runtime
    # (no desde nuestro codigo), vulture no los ve como callers. ---
    "process",  # RunContextAdapter.process (LoggerAdapter base contract)
    "format",  # JsonFormatter.format (Formatter base contract)
    # --- Fase 12a.3: config.Network.netsh_timeout_ms leido por
    # composition_root pero vulture no ve el wiring via settings (mismo
    # patron que lcu_process_names/poll_interval_seconds). Y API publica
    # del FakeNetworkInterfaceInspector.set_snapshot (usado en tests). ---
    "netsh_timeout_ms",
    "set_snapshot",
]
