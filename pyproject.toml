[project]
name = "gnd"
version = "0.1.0"
description = "Game Network Diagnostics — asistente de diagnóstico de red pre/en-partida para League of Legends"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Santiago" }]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psutil>=5.9,<8",
    "matplotlib>=3.7,<4",
    "plyer>=2.1.0",  # Fase 12b.2: notificaciones de escritorio multiplataforma
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.0",
    "vulture>=2.16",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --- ruff: linter único (ENGINEERING_PRINCIPLES.md §6) ---
# Reglas activas mínimas: E, F, I (imports), UP (pyupgrade 3.12), B (bugbear)
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# --- black: formateo, sin custom line-length (ENGINEERING_PRINCIPLES.md §6) ---
[tool.black]
line-length = 88
target-version = ["py312"]
src = ["src", "tests"]

# --- pytest (ENGINEERING_PRINCIPLES.md §4) ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # Tests contra red real (implementacion Fase 2). No corren en CI offline.
    "integration: end-to-end / red real (deselect with '-m \"not integration\"')",
]
addopts = "-m \"not integration\""

# --- vulture: detector de codigo muerto (agregado como guardia extra
# despues del incidente Fase 6 donde x = 1 + 2 + 3 sobrevivio 3 fases
# de ruff+black+pytest sin ser detectado; ruff F841 solo aplica a locales
# dentro de funciones, no a top-level module attrs).
#
# min_confidence=60 para CATCH globales al top-level (como x = 1 + 2 + 3,
# que vulture reporta a 60% con confianza). False positives conocidos
# (Protocols, fakes, side-effects sqlite3) se whitelistean abajo.
[tool.vulture]
min_confidence = 60
paths = ["src/gnd"]
exclude = ["src/gnd/__pycache__"]
ignore_names = [
    # --- domain/ports/* (Protocols declarativos; vulture no los ve como
    # contratos pero los implementadores los cumplen por DI) ---
    "get_latency_baseline",  # DiagnosticsRepository Protocol
    "evaluate",  # RecommendationEngine Protocol
    "save_run",  # DiagnosticsRepository.save_run (Implementaciones de Protocol)
    "save",  # FakeDiagnosticsRepository.save (api de fake usada en tests)
    "get_all",  # FakeDiagnosticsRepository.get_all
    "get_by_provider",  # FakeDiagnosticsRepository.get_by_provider
    # --- domain/fakes/*: APIs publicas de fakes, llamadas desde tests/;
    # vulture no escanea tests/ por defecto ---
    "set_result",
    "set_default_result",
    "set_session_for_run_id",
    "set_default_session",
    # --- protocols de RouteMonitor ---
    "monitor",
    "save_session",
    "get_sessions_by_run",
    # --- protocols de SeriesDataSource (Fase 10): los 5 queries del PRD §10
    # que ChartsSection invoca via getattr por reflection controlada ---
    # vulture no los ve como callers pero el contrato del Protocol exige
    # que estén presentes. ---
    "latency_over_time",
    "packet_loss_over_time",
    "cloudflare_vs_google",
    "riot_latency_over_time",
    "best_hours_to_play",
    # --- live_client_api.is_game_active(): llamada en
    # tests/test_live_client_api.py (5 veces) y scripts/verify_phase6 ---
    "is_game_active",
    # --- ping_parser.all_lost es property usada en
    # tests/test_ping_parser.py (8 referencias) ---
    "all_lost",
    # --- sqlite3 Connection.row_factory es configurado por side-effect:
    # `_conn.row_factory = sqlite3.Row` no es leido como variable, por
    # eso vulture lo marca. El codigo es legitimo (configura el cursor). ---
    "row_factory",
    # --- config/__init__.py: campos Pydantic que no se leen en runtime
    # todavia (live en config.toml para Fase 12) ---
    "lcu_process_names",
    "poll_interval_seconds",
    "baseline_deviation_factor",
    "model_config",
    # --- logging/* overrides de stdlib (Fase 11): metodos que LoggerAdapter
    # y Formatter exigen override y son invocados por la stdlib en runtime
    # (no desde nuestro codigo), vulture no los ve como callers. ---
    "process",  # RunContextAdapter.process (LoggerAdapter base contract)
    "format",  # JsonFormatter.format (Formatter base contract)
    # --- config/__init__.py: settings_customise_sources es override de
    # BaseSettings invocado por pydantic-settings desde su propio __init__
    # al construir la instancia (no desde nuestro codigo). Misma regla que
    # LoggerAdapter.process / Formatter.format (Regla 11.4). Fix Fase 13:
    # agregar TomlConfigSettingsSource para que config.toml cargue (bug
    # descubiero al habilitar speed_test.enabled via TOML).
    "settings_customise_sources",
    # --- Fase 12a.3: config.Network.netsh_timeout_ms leido por
    # composition_root pero vulture no ve el wiring via settings (mismo
    # patron que lcu_process_names/poll_interval_seconds). Y API publica
    # del FakeNetworkInterfaceInspector.set_snapshot (usado en tests). ---
    "netsh_timeout_ms",
    "set_snapshot",
    # --- Fase 12b.3: APIs publicas del scheduler + fake reader usadas
    # solo desde tests/ (vulture no escanea tests/). ``last_report_at``/
    # ``last_report_path`` son properties pensadas para una futura status
    # bar de UI (laguna YAGNI v1 — ver DoD 12b.3); ``tick_now`` es hook
    # invocable programaticamente por tests o un boton "Generar ahora"
    # futuro. Mismo patron que ``set_snapshot`` (12a.3). ---
"add_run",
      "last_report_at",
      "last_report_path",
      "tick_now",
      # --- Fase 12b.4: config.WarpComparison.pause_between_runs_seconds
      # leido via composition_root -> settings (mismo patron que
      # lcu_process_names/poll_interval_seconds). FakeWarpController
      # metodos set_* / set_fail_* son API publica para tests (vulture
      # no escanea tests/). _connected/_registered/_warp_plus son
      # atributos internos mutados por set_*. available es property
      # que coincide con RealWarpController.available. ---  
      "pause_between_runs_seconds",
      "set_connected",
      "set_registered",
      "set_warp_plus",
      "set_fail_on_enable",
      "set_fail_on_disable",
      "set_fail_on_status",
      "set_mode_state",
      "set_tunnel_protocol_state",
      "set_fail_on_set_mode",
      "set_fail_on_set_tunnel_protocol",
      "set_mode_calls",
      "set_tunnel_protocol_calls",
      "_mode",
      "_tunnel_protocol",
      "_fail_on_set_mode",
      "_fail_on_set_proto",
      "_connected",
      "_registered",
      "_warp_plus",
      "available",
      # --- models/warp_comparison.py: dataclass fields accedidos via
      # instancia.public_attribute (vulture no ve el patron de acceso
      # dataclass). Methods get_provider_delta usado en tests. ---  
      "warp_off_run_id",
      "warp_on_run_id",
      "get_provider_delta",
      "status_calls",
      "enable_calls",
      "disable_calls",
      # --- UI: MainWindow atributos usados en callbacks (agendados via
      # root.after, vulture no ve el wiring). _warp_comparison y
      # _last_warp_result son usados en _apply_warp_result /
      # _apply_warp_error / _on_click_warp_comparison. _warp_controller_thread
      # usado en _on_click_warp_comparison / _on_warp_progress /
      # _on_warp_result / _on_warp_error. ---  
      "_warp_comparison",
      "_last_warp_result",
      "_warp_controller_thread",
      # --- WarpComparisonController atributos usados internamente ---
      "_diagnostic_params",
      # --- Fase 12b.5: config.SpeedTest.timeout_seconds leido via
      # composition_root -> settings (mismo patron que
      # lcu_process_names/poll_interval_seconds). FakeSpeedTestController
      # metodos set_result / set_fail_on_run son API publica para tests
      # (vulture no escanea tests/). available es property que coincide
      # con RealSpeedTestController.available. ---
      "timeout_seconds",
      "set_result",
      "set_fail_on_run",
      "run_calls",
      # --- models/speed_test.py: dataclass fields accedidos via
      # instancia.public_attribute (vulture no ve el patron de acceso
      # dataclass). Methods get_delta usado en tests. ---
      "latency_ms",
      "jitter_ms",
      "download_mbps",
      "upload_mbps",
      "packet_loss_pct",
      "server_name",
      "server_country",
      "isp",
      "metric_name",
      "baseline_value",
      "comparison_value",
      "delta",
      "delta_pct",
      "baseline",
      "comparison",
      "overall_verdict",
      "verdict_explanation",
      "baseline_duration_ms",
      "comparison_duration_ms",
      "speed_test_controller_available",
      "get_delta",
      # --- UI: MainWindow atributos usados en callbacks (agendados via
      # root.after, vulture no ve el wiring). _speed_test_comparison y
      # _last_speed_test_result son usados en _apply_speed_test_result /
      # _apply_speed_test_error / _on_click_speed_test. _speed_test_controller_thread
      # usado en _on_click_speed_test / _on_speed_test_progress /
      # _on_speed_test_result / _on_speed_test_error. ---
      "_speed_test_comparison",
      "_last_speed_test_result",
      "_speed_test_controller_thread",
      # --- SpeedTestComparisonController atributos usados internamente ---
      "_speed_test_params",
      # --- Fase 12b.4/12b.5: las clases UseCase + Section UI son instanciadas
      # desde composition_root + MainWindow respectivamente (wiring DI via
      # composition_root.py:build_speed_test_comparison() y MainWindow.__init__).
      # Vulture no resuelve strings imports lazily factory; estos ya estaban
      # reportados a 60% desde Fase 12b.5 original, son falsos positivos
      # legitimos (las clases viven en application/ y ui/ y son llamadas
      # desde afuera de esos modulos). Mismo patron que WiringController de
      # Fase 11 (no se whitelisteo porque su scope era local; estos si
      # ameritan porque vulture sigue reportandolos en cada cierre de fase).
      # Ref: lessons_learned.md Regla 9.5 (vulture), 11.4 (overrides stdlib).
      "SpeedTestComparisonUseCase",
      "SpeedTestComparisonSection",
      # --- Fase 13: FakeGameDiagnosticsModule metodos set_* / atributos
      # *_calls son API publica para tests (vulture no escanea tests/).
      # LeagueOfLegendsModule._settings accedido perezosamente via
      # _get_settings (vulture no ve el flujo). ValorantModule
      # _DEFAULT_VALORANT_ENDPOINTS_V4 leido solo en fallback except.
      # models/game_endpoint.py GameEndpointVO accedido via instancia.
      # RunFullDiagnostics._game_module usado condicionalmente en execute.
      # build_game_module en composition_root llamado desde
      # build_run_full_diagnostics (vulture no ve la llamada via setting
      # de kwarg). ---
      "set_public_endpoints",
      "set_process_names",
      "set_detect_result",
      "set_game_server_provider",
      "public_endpoints_calls",
      "process_names_calls",
      "detect_calls",
      "game_server_provider_calls",
      "_settings",
      "_DEFAULT_VALORANT_ENDPOINTS_V4",
      "_game_module",
      "build_game_module",
      # --- Fase 14.0a: LockfileReader Protocol + FakeLockfileReader API
      # publica (set_result, read_calls) usadas solo en tests (vulture no
      # escanea tests/). LockfileData.parse() classmethod consumido por
      # network/lockfile_discovery.py (sub-fase 14.0b, todavia no existe)
      # — falso positivo legitimo en 14.0a, se consumira en 14.0b.
      # LcuClient Protocol + FakeLcuClient.set_result/get_session_calls
      # mismo patron. GameflowSession.has_active_game_server() helper
      # consumido por LeagueOfLegendsModule.detect_active_server en
      # sub-fase 14.0d (no existe todavia) — falso positivo legitimo,
      # se consumira en 14.0d. ActiveGameServerInfo.precision_tier /
      # region_tag son defaults backwards-compat leidos por
      # RunFullDiagnostics en sub-fase 14.0f (no existe todavia) ---
      "LockfileReader",
      "read",
      "FakeLockfileReader",
      "set_result",
      "read_calls",
      "parse",
      "LcuClient",
      "get_gameflow_session",
      "FakeLcuClient",
      "get_session_calls",
      "has_active_game_server",
      "precision_tier",
      "region_tag",
  ]
